<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>演出・お題画面</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="display-body">
    <div id="qr-container" style="display:none; text-align: center;">
        <h1 id="qr-message"></h1>
        <div id="qr-codes" style="display: flex; justify-content: center; gap: 50px; margin-top: 30px;"></div>
        <!-- ログインしたメンバーをリアルタイムで表示するエリア -->
        <div id="login-users-list" style="margin-top: 40px; color: #ffffff; font-size: 1.5rem;"></div>
    </div>

    <div id="display-container" style="display:none; width: 100%;">
        <h1 id="main-title">待機中</h1>
        <div id="content-area"></div>
        <div id="effect-area"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./js/display.js"></script>
</body>
</html>
