<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPPON 制御リモコン</title>
    <link rel="stylesheet" href="css/ippon.css">
    <script src="/socket.io/socket.io.js"></script>
    <!-- 🎨 PWA用の設定図面（マニフェスト）を読み込み -->
<link rel="manifest" href="/manifest.json">
<!-- iPhone用のホーム画面アイコン設定（Safari用） -->
<link rel="apple-touch-icon" href="/images/icon-192.png">

<!-- PWAの管理人（Service Worker）をブラウザに登録するスクリプト -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => console.log('PWA Service Worker 登録成功！', reg.scope))
        .catch(err => console.error('PWA登録エラー:', err));
    });
  }
</script>

</head>
<body>

    <div class="flex-container">
        <!-- ヘッダー -->
        <div class="header">
            <button id="menu-add-btn" class="btn-menu bg-yellow">お題追加</button>
            <button id="menu-end-btn" class="btn-menu bg-red">ゲーム終了</button>
        </div>

        <!-- 経過時間 -->
        <div class="timer-box" id="timer-display">00:00</div>

        <!-- お題モニター -->
        <div class="monitor">
            <div class="label">現在のお題:</div>
            <div class="text-box" id="current-q" style="color: #ffd400;">未出題</div>
            <div class="label">次のお題 (通常ランダム):</div>
            <div class="text-box" id="next-q">お題を読み込み中...</div>
            
            <!-- 💡【追加】お題を選んで出すためのセレクトボックス -->
            <div class="label" style="margin-top:2px;">🎯 狙い撃ちでお題を選ぶ場合:</div>
            <select id="ippon-select-q" style="width:100%; padding:6px; font-size:0.95rem; border-radius:4px; background:#000; color:#fff; border:1px solid #ffd400; outline:none; font-weight:bold;"></select>
        </div>

        <!-- 出題ボタン -->
        <button id="submit-q-btn" class="btn-submit bg-yellow">🎯 お題を出題する</button>

        <!-- 現在の順位と点数 -->
        <div class="rank-box">
            <div class="label" style="margin-bottom: 5px;">現在の順位と点数:</div>
            <div id="rank-list"></div>
        </div>

        <!-- 投票終了ボタンのみ -->
        <div class="action-box">
            <button id="action-correct-btn" class="btn-action bg-yellow" style="color:#000; width:100%;">🏆 投票終了 (一本判定)</button>
        </div>
    </div>

    <!-- お題追加モーダル -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <h3>お題を即時追加</h3>
            <textarea id="new-q-text" placeholder="ここに新しいお題を入力してください"></textarea>
            <button id="modal-cancel-btn">キャンセル</button>
            <button id="modal-submit-btn" class="bg-yellow" style="color:#000;">追加する</button>
        </div>
    </div>

    <!-- ゲーム終了モーダル -->
    <div id="end-modal" class="modal">
        <div class="modal-content">
            <h3>ゲームを終了しますか？</h3>
            <p style="font-size:0.9rem; color:#ccc;">PC画面に最終ランキングを表示します。</p>
            <button id="end-rank-btn" class="bg-yellow" style="color:#000; width:100%; padding:12px; margin-bottom:10px;">📊 ランキングを表示</button>
            <button id="end-restart-btn" style="width:48%;">🔄 もう一度同じゲーム</button>
            <button id="end-back-btn" class="bg-red" style="width:48%;">↩️ モード選択へ戻る</button>
            <button id="end-close-btn" style="width:100%; margin-top:10px; background:#444; color:#fff; border:none;">閉じる</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/controller.js"></script>
</body>
</html>
