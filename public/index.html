<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番組風ゲーム配信システム - ハブ</title>
    <!-- 共通の style.css を読み込み -->
    <link rel="stylesheet" href="css/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <!-- 🎨 PWA用の設定図面（マニフェスト）を読み込み -->
<link rel="manifest" href="/manifest.json">
<!-- iPhone用のホーム画面アイコン設定（Safari用） -->
<link rel="apple-touch-icon" href="/images/icon-192.png">

<!-- PWAの管理人（Service Worker）をブラウザに登録するスクリプト -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => console.log('PWA Service Worker 登録成功！', reg.scope))
        .catch(err => console.error('PWA登録エラー:', err));
    });
  }
</script>

</head>
<body class="hub-body">

<div class="hub-container">
    
    <!-- 🎛️ 1. 最初にどちらかを選ぶ画面（新しく増えた選択肢） -->
    <div id="role-select-screen" class="setup-box" style="display: block;">
        <h1>大喜利・クイズハブ</h1>
        <h3>この端末の役割を選択してください</h3>
        <div class="menu-grid">
            <button class="menu-card menu-card-ippon" onclick="chooseRole('pc-display')">📺 PC（テレビ演出）画面として起動</button>
            <button class="menu-card menu-card-quiz" onclick="chooseRole('controller-setup')">📱 制御スマホ（司会者）として起動</button>
        </div>
    </div>

    <!-- 📺 2. 元々のPCセットアップ画面（最初は非表示にしておき、選ばれたら出す） -->
    <div id="pc-setup-container" class="setup-box" style="display: none;">
        <h1>共通リアルタイムハブ</h1>
        <h3>大喜利・クイズ 進行メインシステム</h3>
        <div class="qr-wrapper">
            <!-- 💡 ここにサーバーから届いた制御用スマホのQRがはめ込まれます（元通り） -->
            <img id="qr-image" src="" alt="制御用QRコード">
        </div>
    </div>

    <!-- 📱 3. 元々のスマホ用操作画面（同じく最初は非表示） -->
    <div id="mobile-menu-container" style="display: none;">
        
        <!-- モード選択（大喜利かクイズか） -->
        <div id="mode-select-screen" class="setup-box" style="display: none;">
            <h1>モード選択</h1>
            <h3>開催するゲームを選んでください</h3>
            <div class="menu-grid">
                <button class="menu-card menu-card-ippon" onclick="chooseMode('ippon')">🟨 IPPONグランプリ（大喜利）</button>
                <button class="menu-card menu-card-quiz" onclick="chooseMode('buzzer')">🟥 早押しクイズ</button>
            </div>
        </div>

        <!-- 本番管理（スタートボタン・参加者リスト） -->
        <div id="game-control-screen" class="control-box" style="display: none;">
            <h2 id="selected-mode-title" class="screen-title">ゲーム準備中</h2>
            <button class="btn-start" onclick="startGame()">🚀 本番ゲームスタート！</button>
            <button class="btn-back" onclick="backToMenu()">⬅️ モード選択に戻る</button>
            
            <div class="voters-section">
                <p id="current-voters-count">👥 ログインした参加者 (0人)</p>
                <div id="ctrl-user-list"></div>
            </div>
        </div>
        
    </div>

</div>

    </div>

    <!-- 共通の script.js を読み込み -->
    <script src="js/script.js"></script>
</body>
</html>
